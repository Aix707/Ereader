name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.0.0"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Verify imports and persistence
        run: npm test

      - name: Verify WebView2 imports
        run: npm run test:desktop

      - name: Verify fullscreen client bounds and restore
        run: npm run test:window -- --skip-build

      - name: Package Windows installer
        run: npm run release:win

      - name: Prepare source, standalone executable and checksums
        run: npm run prepare:release

      - name: Prepare draft release
        id: release_context
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.eventName === "workflow_dispatch"
              ? context.payload.inputs.tag
              : context.ref.replace("refs/tags/", "");
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });
            const published = releases.some(release => release.tag_name === tag && !release.draft);
            core.setOutput("published", published ? "true" : "false");
            core.setOutput("tag", tag);

      - name: Upload draft release
        if: steps.release_context.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_context.outputs.tag }}
          name: Ereader ${{ steps.release_context.outputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/Ereader-*-Setup-x64.exe
            release/Ereader.exe
            release/Ereader-*-Source.zip
            release/SHA256SUMS.txt
